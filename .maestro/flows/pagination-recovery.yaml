appId: com.adlerventures.explora
name: Later-page failure and recovery
tags:
  - assessment
  - states
---
- runFlow: ../subflows/reset-test-state.yaml
- scrollUntilVisible:
    element:
      id: "dev-tools-catalog-mode-performance"
    direction: UP
- tapOn:
    id: "dev-tools-catalog-mode-performance"
- scrollUntilVisible:
    element:
      id: "dev-tools-catalog-count"
    direction: DOWN
- assertVisible: "Catalog activities, 1,012"
- scrollUntilVisible:
    element:
      id: "dev-tools-page-load-timeout"
    direction: UP
- tapOn:
    id: "dev-tools-page-load-timeout"
- scrollUntilVisible:
    element:
      id: "dev-tools-initial-load-normal"
    direction: UP
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Explore"
- runFlow:
    when:
      visible:
        id: "activity-detail-back"
    commands:
      - tapOn:
          id: "activity-detail-back"
- extendedWaitUntil:
    visible:
      id: "explore-list"
    timeout: 8000
- repeat:
    times: 22
    commands:
      - swipe:
          direction: UP
          duration: 280
- extendedWaitUntil:
    visible:
      id: "explore-next-page-error"
    timeout: 10000
- assertVisible: "Could not load more"
- assertVisible:
    id: "explore-next-page-retry"

- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Explore"
- tapOn: "Dev Tools"
- extendedWaitUntil:
    visible:
      id: "dev-tools-screen"
    timeout: 8000
- scrollUntilVisible:
    element:
      id: "dev-tools-page-load-normal"
    direction: DOWN
- tapOn:
    id: "dev-tools-page-load-normal"
- scrollUntilVisible:
    element:
      id: "dev-tools-initial-load-normal"
    direction: UP
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Explore"
- runFlow:
    when:
      visible:
        id: "activity-detail-back"
    commands:
      - tapOn:
          id: "activity-detail-back"
- extendedWaitUntil:
    visible:
      id: "explore-list"
    timeout: 8000
- extendedWaitUntil:
    notVisible:
      id: "explore-next-page-error"
    timeout: 8000
- assertVisible:
    id: "explore-list"
