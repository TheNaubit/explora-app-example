appId: com.adlerventures.explora
name: Detail loading, invalid data, and not found
tags:
  - assessment
  - states
---
- runFlow: ../subflows/reset-test-state.yaml
- scrollUntilVisible:
    element:
      id: "dev-tools-initial-load-invalid-data"
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: "dev-tools-detail-load-slow"
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: "dev-tools-detail-load-slow"
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Explore"
- extendedWaitUntil:
    visible:
      id: "explore-list"
    timeout: 8000
- tapOn:
    id: "activity-card-act-001"
- assertVisible:
    id: "activity-detail-skeleton"
- extendedWaitUntil:
    visible:
      id: "activity-detail-content"
    timeout: 15000
- tapOn:
    id: "activity-detail-back"

- tapOn: "Dev Tools"
- scrollUntilVisible:
    element:
      id: "dev-tools-detail-load-invalid-data"
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: "dev-tools-detail-load-invalid-data"
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Explore"
- tapOn:
    id: "activity-card-act-001"
- extendedWaitUntil:
    visible:
      id: "activity-detail-error"
    timeout: 8000
- assertVisible: "Could not load activity"
- assertVisible: "The data from the server was invalid."
- assertNotVisible: "Render Error"
- tapOn:
    id: "activity-detail-back"

- tapOn: "Dev Tools"
- scrollUntilVisible:
    element:
      id: "dev-tools-detail-load-not-found"
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: "dev-tools-detail-load-not-found"
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Explore"
- tapOn:
    id: "activity-card-act-001"
- extendedWaitUntil:
    visible:
      id: "activity-detail-not-found"
    timeout: 8000
- assertVisible: "Activity unavailable"
