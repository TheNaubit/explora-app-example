appId: com.adlerventures.explora
name: Refresh failure keeps content and success adds one
tags:
  - assessment
  - assessment-required
  - recovery
  - states
---
- runFlow: ../subflows/reset-test-state.yaml
- scrollUntilVisible:
    element:
      id: "dev-tools-initial-load-invalid-data"
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: "dev-tools-detail-load-not-found"
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: "dev-tools-page-load-invalid-data"
    direction: DOWN
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: "dev-tools-refresh-fail"
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: "dev-tools-refresh-fail"
- scrollUntilVisible:
    element:
      id: "dev-tools-initial-load-normal"
    direction: UP
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Explore"
- extendedWaitUntil:
    visible:
      id: "explore-list"
    timeout: 8000
- scrollUntilVisible:
    element:
      id: "activity-card-act-001"
    direction: UP
- swipe:
    start: 50%, 40%
    end: 50%, 80%
    duration: 2500
- extendedWaitUntil:
    visible:
      id: "explore-list"
    timeout: 8000
- assertNotVisible:
    id: "explore-load-error"

- tapOn: "Dev Tools"
- scrollUntilVisible:
    element:
      id: "dev-tools-catalog-count"
    direction: DOWN
- assertVisible:
    id: "dev-tools-catalog-count"
- assertVisible: "Catalog activities, 12"

- scrollUntilVisible:
    element:
      id: "dev-tools-refresh-timeout"
    direction: UP
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: "dev-tools-refresh-success"
    direction: UP
    visibilityPercentage: 50
- tapOn:
    id: "dev-tools-refresh-success"
- scrollUntilVisible:
    element:
      id: "dev-tools-initial-load-normal"
    direction: UP
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Explore"
- scrollUntilVisible:
    element:
      id: "activity-card-act-001"
    direction: UP
- swipe:
    start: 50%, 40%
    end: 50%, 80%
    duration: 2500
- extendedWaitUntil:
    notVisible:
      id: "pull-to-refresh-indicator"
    timeout: 8000

- tapOn: "Dev Tools"
- scrollUntilVisible:
    element:
      id: "dev-tools-catalog-count"
    direction: DOWN
- assertVisible: "Catalog activities, 13"
